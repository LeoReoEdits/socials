<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socials</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            flex-direction: column;
        }
        .container {
            text-align: center;
            max-width: 600px;
            padding: 20px;
        }
        .profile-pic {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
        }
        .username {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        .bio {
            font-size: 18px;
            color: #333;
            margin-bottom: 30px;
        }
        .link {
            display: flex;
            align-items: center;
            background-color: #fff;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            text-decoration: none;
            color: #333;
            font-size: 18px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
        }
        .link:hover {
            transform: scale(1.05);
        }
        .link img {
            width: 30px;
            height: 30px;
            margin-right: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="pp.png" alt="Photo de profil" class="profile-pic">
        <div class="username">LeoReoEdits</div>
        <p class="bio">All my socials 🫣</p>
        <a href="https://www.tiktok.com/@leoreoedits" class="link">
            <img src="tiktok.png" alt="TikTok"> TikTok
        </a>
        <a href="https://www.instagram.com/leoreoedits" class="link">
            <img src="insta.png" alt="Instagram"> Instagram
        </a>
    </div>
</body>
</html>
